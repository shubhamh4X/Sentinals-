version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-ac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_ac}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sentinel_app} -d $${POSTGRES_DB:-sentinel_ac}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-ac-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"

  fastapi-backend:
    build:
      context: ../backend
    container_name: sentinel-ac-backend
    restart: unless-stopped
    environment:
      SENTINEL_AGENT_HMAC_SECRET: ${SENTINEL_AGENT_HMAC_SECRET:-replace_with_32_byte_secret}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
